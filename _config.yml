# -------------------
# Jekyll Config (merged & cleaned)
# -------------------
baseurl: ""
url: "https://yeeunshin.com"
permalink: pretty

# Markdown & highlight
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

# Plugins used by the current build
plugins:
  - jekyll-email-protect
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-regex-replace
  - jekyll-scholar
  - jekyll-sitemap
  - jekyll-terser

# Collections
collections_dir: collections
collections:
  projects:
    output: true
    permalink: /:collection/:path/
  gallery:
    output: true
    permalink: /crafting/:path/ #
  gallery_hci:
    output: true
    permalink: /human-centered/:path/ #
  publication:
    output: true
    permalink: /publication/:path/

# Pages defaults + sitemap defaults (한 배열로 병합)
defaults:
  - scope:
      path: ""
      type: "gallery" 
    values:
      layout: null  
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: "images"
    values:
      image: true
  - scope:
      path: "pages"
    values:
      permalink: /:basename/
  - scope:
      path: "assets"
    values:
      sitemap: false

# SCSS
sass:
  style: compact
  load_paths:
    - _sass

# Build exclusions and GitHub Pages passthrough files
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - bin/
  - vendor
keep_files:
  - CNAME
  - .nojekyll

# Theme Config
title: "Yeeun Shin"

colors:
  primary_bg: "#f8f8f8"
  primary_bg_2: "#0d042b"
  primary_bg_3: "#CDD9E4"
  primary_text: "#fdfcf9"
  base_bg: "#f8f8f8"
  base_bg_2: "#F1F3F5"
  base_bg_3: "#D2D9DF"
  base_text: "#0d042b"
  base_text_2: "#3b364c"
  logo_text: "#0d042b"
  header_text: "#0d042b"
  primary_bg_dark: "#fdfcf9"
  primary_bg_2_dark: "#fdfcf9"
  primary_bg_3_dark: "#fdfcf9"
  primary_text_dark: "#0b0326"
  base_bg_dark: "#0b0326"
  base_bg_2_dark: "#150c32"
  base_bg_3_dark: "#251654"
  base_text_dark: "#f5f5ec"
  base_text_2_dark: "#929eaf"
  logo_text_dark: "#fdfcf9"
  header_text_dark: "#fdfcf9"

fonts:
  heading: "'Inter'"
  base: "'Inter'"
  monospace: "'Fira Mono'"
  logo: "'Inter'"

logo:
  logo_text: "YEEUN SHIN."
  logo_image: assets/images/logo/logo.png
  logo_image_mobile: assets/images/logo/logo-mobile.png
  logo_image_invert: assets/images/logo/logo-invert.png
  logo_image_invert_mobile: assets/images/logo/logo-invert-mobile.png
  logo_image_desktop_height: "28px"
  logo_image_desktop_width: "28px"
  logo_image_mobile_height: "28px"
  logo_image_mobile_width: "28px"
  show_logo_image_on_mobile: false
  show_logo_image_on_desktop: false
  show_logo_text_on_mobile: true
  show_logo_text_on_desktop: true

header:
  fixed: false

open_graph:
  meta_opengraph_type: "website"
  meta_twitter_card: "summary"
  meta_twitter_site: "@yeeun_yes"
  meta_twitter_creator: "@yeeun_yes"

darkmode:
  enable_dark_mode: true
  show_dark_mode_toggle_in_header: true
  show_dark_mode_toggle_in_bottom: false
  show_dark_mode_toggle_in_mobile_menu: true

cookie_banner:
  enabled: true
  show_manage_cookies_at_bottom: true

analytics:
  google_analytics_id: "G-0RLB95W610"
  gtm_id: ""
  plausible_data_domain: ""
  umami_data_website_id: ""
  umami_src: ""

contact_form:
  use_formspree_form: true
  formspree_endpoint: https://formspree.io/f/moqyklqv

menu:
  show_dropdown_items_in_mobile_menu: false
  show_social_media_in_mobile_menu: true

footer:
  enable_footer: false

bottom:
  enable_bottom: true
  copyright_text: "© 2025 Yeeun Shin."

# -------------------
# Jekyll Scholar (migrated)
# -------------------
scholar:
  last_name: [Shin]
  first_name: [Yeeun]

  style: apa
  locale: en

  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters: [latex, smallcaps, superscript]

  replace_strings: true
  join_strings: true

  details_dir: bibliography
  details_link: Details

  query: "@*"
  group_by: year
  group_order: descending

  type: "project"
  repository: "publications"

filtered_bibtex_keywords:
  [abbr, abstract, additional_info, altmetric, annotation, arxiv, award, award_name,
   bibtex_show, blog, code, google_scholar_id, html, inspirehep_id, pdf, poster, preview,
   selected, slides, supp, video, website]

# max_author_limit: 10
more_authors_animation_delay: 10
enable_publication_thumbnails: true
